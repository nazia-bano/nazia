<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #333333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555555;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group input[type="date"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .form-group input[type="text"]:focus,
        .form-group input[type="email"]:focus,
        .form-group input[type="password"]:focus,
        .form-group input[type="date"]:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #4caf50;
            outline: none;
        }
        .radio-group, .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            padding-top: 5px;
        }
        .radio-group label, .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
        }
        .radio-group input, .checkbox-group input {
            margin-right: 6px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .button-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit {
            background-color: #4caf50;
            color: white;
        }
        .btn-submit:hover {
            background-color: #45a049;
        }
        .btn-reset {
            background-color: #f44336;
            color: white;
        }
        .btn-reset:hover {
            background-color: #da190b;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Student Registration</h2>
    <!-- enctype="multipart/form-data" is essential for file uploads to work -->
    <form action="#" method="POST" enctype="multipart/form-data">
        
        <!-- Name (Text Input) -->
        <div class="form-group">
            <label for="student-name">Full Name</label>
            <input type="text" id="student-name" name="student_name" placeholder="John Doe" required>
        </div>

        <!-- Email (Email Input) -->
        <div class="form-group">
            <label for="student-email">Email Address</label>
            <input type="email" id="student-email" name="student_email" placeholder="example@domain.com" required>
        </div>

        <!-- Password (Password Input) -->
        <div class="form-group">
            <label for="student-password">Password</label>
            <input type="password" id="student-password" name="student_password" placeholder="Minimum 8 characters" minlength="8" required>
        </div>

        <!-- Gender (Radio Buttons) -->
        <div class="form-group">
            <label>Gender</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="male" required> Male</label>
                <label><input type="radio" name="gender" value="female"> Female</label>
                <label><input type="radio" name="gender" value="other"> Other</label>
            </div>
        </div>

        <!-- Course (Dropdown Selector) -->
        <div class="form-group">
            <label for="course-select">Select Course</label>
            <select id="course-select" name="course" required>
                <option value="" disabled selected>-- Choose a course --</option>
                <option value="computer-science">Computer Science</option>
                <option value="data-science">Data Science</option>
                <option value="information-technology">Information Technology</option>
                <option value="business-administration">Business Administration</option>
            </select>
        </div>

        <!-- Date of Birth (Date Picker) -->
        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <!-- Hobbies (Checkboxes) -->
        <div class="form-group">
            <label>Hobbies</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="hobbies" value="reading"> Reading</label>
                <label><input type="checkbox" name="hobbies" value="coding"> Coding</label>
                <label><input type="checkbox" name="hobbies" value="sports"> Sports</label>
                <label><input type="checkbox" name="hobbies" value="music"> Music</label>
            </div>
        </div>

        <!-- Address (Textarea) -->
        <div class="form-group">
            <label for="address">Permanent Address</label>
            <textarea id="address" name="address" rows="3" placeholder="Enter your full street address..." required></textarea>
        </div>

        <!-- File Upload (File Input) -->
        <div class="form-group">
            <label for="file-upload">Upload Student Photo / Documents</label>
            <input type="file" id="file-upload" name="student_file" accept=".jpg,.jpeg,.png,.pdf">
        </div>

        <!-- Action Buttons (Submit/Reset controls) -->
        <div class="button-group">
            <button type="submit" class="btn-submit">Submit</button>
            <button type="reset" class="btn-reset">Reset</button>
        </div>

    </form>
</div>

</body>
</html>
